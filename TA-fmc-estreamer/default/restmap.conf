# REST API used by the app's Inputs page (bin/fmc_estreamer_rest.py)
[script:fmc_estreamer_inputs]
match = /fmc_estreamer/inputs
script = fmc_estreamer_rest.py
scripttype = persist
handler = fmc_estreamer_rest.Handler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
passHttpCookies = false
python.version = python3
python.required = 3.13,3.9

[script:fmc_estreamer_certificates]
match = /fmc_estreamer/certificates
script = fmc_estreamer_rest.py
scripttype = persist
handler = fmc_estreamer_rest.Handler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
passHttpCookies = false
python.version = python3
python.required = 3.13,3.9
