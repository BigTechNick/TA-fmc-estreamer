# CIM data models for the event types in eventtypes.conf:
#   policy violation -> Alerts; FireAMP -> Malware (Malware_Attacks);
#   VPN login -> Network Sessions (start) and Authentication; VPN logoff -> Network Sessions (end).
[eventtype=fmc_estreamer_policy_violation]
alert = enabled

[eventtype=fmc_estreamer_fireamp]
malware = enabled
attack = enabled

[eventtype=fmc_estreamer_vpn_login]
network = enabled
session = enabled
start = enabled
vpn = enabled
authentication = enabled

[eventtype=fmc_estreamer_vpn_logoff]
network = enabled
session = enabled
end = enabled
vpn = enabled
