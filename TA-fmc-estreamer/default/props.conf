# ---------------------------------------------------------------- events
# Event files: <event folder>/<input>/<input>_<fmc>_<date>_<HHMMSS>_w<n>.log
# (the .cef files next to them are not read by Splunk).
# Each input's file monitor reads them as fmc:estreamer:events (one JSON object
# per line, "time" first); at index time the sourcetype becomes
# cisco:sfw:estreamer (transforms.conf), the one the Cisco Security Cloud app's
# field aliases and CIM mappings use. TRUNCATE leaves room for intrusion packets
# (up to 64 KB of packet as hex in PacketData).
[fmc:estreamer:events]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^\{"time":
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 12
TRUNCATE = 400000
TRANSFORMS-fmc_estreamer_sourcetype = fmc_estreamer_sourcetype

# ---------------------------------------------------------------- collector logs
# $SPLUNK_HOME/var/log/splunk/fmc_estreamer_<input>.log and _console.log -> index _internal
[source::.../var/log/splunk/fmc_estreamer_*.log*]
priority = 10
sourcetype = fmc:estreamer:log

# $SPLUNK_HOME/var/log/splunk/fmc_estreamer-webapi.log (Inputs page actions)
[source::.../var/log/splunk/fmc_estreamer-webapi.log*]
priority = 10
sourcetype = fmc:estreamer:webapi

[fmc:estreamer:log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
TRUNCATE = 20000
EXTRACT-fmc_input = fmc_estreamer_(?<input>[^\\/]+?)(?:_console)?\.log(?:\.\d+)?$ in source
EXTRACT-fmc_line = ^\S+ \S+ (?:worker-(?<worker>\d+) )?(?<log_level>DEBUG|INFO|WARNING|ERROR|CRITICAL) (?<message>.*)
EXTRACT-fmc_stats = written (?<written_eps>\d+)/s, records (?<records_eps>\d+)/s, metadata (?<metadata>\d+), skipped (?<skipped>\d+), errors (?<errors>\d+), inflight (?<inflight>\d+), bookmark (?<bookmark>\S+), behind (?<behind_min>-?[\d.]+) min(?:, buffer (?<buffer_gb>[\d.]+) GB(?<paused> PAUSED)?)?
EXTRACT-fmc_connect = connected to (?<fmc_host>[^\s,]+):(?<fmc_port>\d+), requesting from (?<requested_from>\S+)
EXTRACT-fmc_session = session ended: (?<session_error>.+)

[fmc:estreamer:webapi]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
EXTRACT-fmc_webapi = ^\S+ \S+ (?<log_level>[A-Z]+) (?<message>.*)

# ---------------------------------------------------------------- search time (search heads)
# The policy violation, VPN and FireAMP events use the source field names the Cisco Security
# Cloud app aliases to CIM on this sourcetype (InitiatorIP AS src, ...). These add what it
# has no source name for. Unique class names: nothing here replaces one of that app's settings.
# OUTPUTNEW: the lookup only fills action where it is still empty (VPN logins), never
# changing the action that app sets on other events.
[cisco:sfw:estreamer]
EVAL-signature = coalesce(CorrelationRule, signature)
EVAL-signature_id = coalesce(CorrelationRuleID, signature_id)
LOOKUP-fmc_estreamer_vpn_action = fmc_estreamer_vpn_action EventType OUTPUTNEW action
