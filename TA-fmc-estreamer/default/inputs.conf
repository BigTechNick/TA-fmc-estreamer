# Defaults for every fmc_estreamer input. Inputs themselves are created in
# Splunk Web (app > Inputs, or Settings > Data inputs > FMC eStreamer events)
# and saved in this app's local/inputs.conf.
[fmc_estreamer]
python.version = python3
python.required = 3.13,3.9
interval = 60
fmc_port = 8302
start_from = bookmark
verify_fmc = off
workers = 4
buffer_max_gb = 200
when_full = delete_oldest
delete_after_min = 15
rotate_mb = 1024
log_level = INFO
index_in_splunk = 1
write_cef = 0
connection_events = 1
policy_violation_events = 0
vpn_events = 0
fireamp_events = 0
file_events = 0
intrusion_events = 0
intrusion_packets = 0
