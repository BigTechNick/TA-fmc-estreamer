# TA-fmc-estreamer
[install]
build = 12

[launcher]
author = Nikhil Chawla
description = Collects events from a Secure Firewall Management Center (FMC) over eStreamer: connection, policy violation, VPN, FireAMP, file, intrusion and packet events, for Splunk as sourcetype cisco:sfw:estreamer and/or as CEF files. CIM mapping needs the Cisco Security Cloud app on the search heads. Inputs, certificates and status are managed in Splunk Web. Not affiliated with Cisco.
version = 2.2.1

[ui]
is_visible = true
label = Nikhil Chawla Add-on for Cisco Secure Firewall eStreamer (FMC)
supported_themes = light,dark

[package]
id = TA-fmc-estreamer
check_for_updates = true

[id]
name = TA-fmc-estreamer
version = 2.2.1
