# Index time: events read as fmc:estreamer:events (props.conf) are stored as
# cisco:sfw:estreamer.
[fmc_estreamer_sourcetype]
REGEX = .
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::cisco:sfw:estreamer

# Search time: action = success for VPN logins (CIM Authentication); see props.conf.
[fmc_estreamer_vpn_action]
filename = fmc_estreamer_vpn_action.csv
