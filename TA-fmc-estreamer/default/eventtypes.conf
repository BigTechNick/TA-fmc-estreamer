# Search time (search heads): the event types this add-on adds to cisco:sfw:estreamer,
# tagged for the CIM data models in tags.conf. Connection, file and intrusion events use
# the Cisco Security Cloud app's own event types and CIM mappings.
[fmc_estreamer_policy_violation]
search = sourcetype=cisco:sfw:estreamer EventType=CorrelationEvent

[fmc_estreamer_fireamp]
search = sourcetype=cisco:sfw:estreamer EventType=MalwareEvent

[fmc_estreamer_vpn_login]
search = sourcetype=cisco:sfw:estreamer EventType=VPNLoginEvent

[fmc_estreamer_vpn_logoff]
search = sourcetype=cisco:sfw:estreamer EventType=VPNLogoffEvent
